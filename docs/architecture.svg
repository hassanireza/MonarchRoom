<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0f0e"/>
      <stop offset="100%" stop-color="#050605"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#efd08c"/>
      <stop offset="100%" stop-color="#c9a763"/>
    </linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#bg)"/>

  <!-- React layer -->
  <rect x="40" y="30" width="820" height="90" rx="10" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="60" y="55" fill="#efd08c" font-size="13" letter-spacing="2">REACT PRESENTATION LAYER</text>
  <g fill="#f5efe2" font-size="12">
    <rect x="60" y="68" width="120" height="34" rx="6" fill="#12100a" stroke="#c9a763"/>
    <text x="120" y="89" text-anchor="middle">TopBar</text>
    <rect x="195" y="68" width="120" height="34" rx="6" fill="#12100a" stroke="#c9a763"/>
    <text x="255" y="89" text-anchor="middle">LeftPanel</text>
    <rect x="330" y="68" width="120" height="34" rx="6" fill="#12100a" stroke="#c9a763"/>
    <text x="390" y="89" text-anchor="middle">Table / Seat</text>
    <rect x="465" y="68" width="140" height="34" rx="6" fill="#12100a" stroke="#c9a763"/>
    <text x="535" y="89" text-anchor="middle">ControlPanel</text>
    <rect x="620" y="68" width="120" height="34" rx="6" fill="#12100a" stroke="#c9a763"/>
    <text x="680" y="89" text-anchor="middle">Toast</text>
  </g>

  <!-- Hook bridge -->
  <rect x="290" y="150" width="320" height="50" rx="10" fill="#0b1512" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="450" y="180" fill="#efd08c" font-size="13" text-anchor="middle">useMonarchEngine (React hook bridge)</text>

  <path d="M450 120 L450 150" stroke="#c9a763" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M450 200 L450 230" stroke="#c9a763" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Engine layer -->
  <rect x="40" y="230" width="820" height="200" rx="10" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="60" y="255" fill="#efd08c" font-size="13" letter-spacing="2">OOP GAME ENGINE (src/engine)</text>

  <g fill="#f5efe2" font-size="12">
    <rect x="60" y="270" width="180" height="46" rx="6" fill="#12100a" stroke="#c9a763"/>
    <text x="150" y="290" text-anchor="middle">MonarchEngine</text>
    <text x="150" y="306" text-anchor="middle" font-size="10" fill="#a89f8e">state machine</text>

    <rect x="270" y="270" width="150" height="46" rx="6" fill="#12100a" stroke="#c9a763"/>
    <text x="345" y="290" text-anchor="middle">Deck</text>
    <text x="345" y="306" text-anchor="middle" font-size="10" fill="#a89f8e">shuffle / deal</text>

    <rect x="450" y="270" width="180" height="46" rx="6" fill="#12100a" stroke="#c9a763"/>
    <text x="540" y="290" text-anchor="middle">HandEvaluator</text>
    <text x="540" y="306" text-anchor="middle" font-size="10" fill="#a89f8e">static rank compare</text>

    <rect x="660" y="270" width="180" height="46" rx="6" fill="#12100a" stroke="#c9a763"/>
    <text x="750" y="290" text-anchor="middle">AIStrategy</text>
    <text x="750" y="306" text-anchor="middle" font-size="10" fill="#a89f8e">opponent decisions</text>

    <rect x="60" y="345" width="780" height="60" rx="6" fill="#12100a" stroke="#c9a763" stroke-dasharray="4 3"/>
    <text x="450" y="370" text-anchor="middle" fill="#a89f8e" font-size="11">
      GameState (players, deck, community, pot, phase) &mdash; single source of truth, immutable snapshots emitted on every change
    </text>
    <text x="450" y="390" text-anchor="middle" fill="#a89f8e" font-size="11">
      Persisted to localStorage between sessions
    </text>
  </g>

  <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#c9a763"/>
  </marker>

  <text x="450" y="445" text-anchor="middle" fill="#a89f8e" font-size="11">
    Deploy pipeline: GitHub Actions builds with Vite and publishes dist/ to GitHub Pages
  </text>
</svg>
